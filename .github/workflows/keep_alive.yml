name: Keep Supabase Active (Best Effort)

on:
  schedule:
    - cron: '0 0 * * 1,4' # Monday and Thursday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required repository secrets
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Ping Supabase REST API Root
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          # Sanitize variables to remove any Windows CRLF carriage returns
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d '\r' | sed 's/*$//')
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r')

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 30 \
            "${CLEAN_URL%/}/rest/v1/" \
            --header "apikey: ${CLEAN_KEY}" \
            --header "Authorization: Bearer ${CLEAN_KEY}" \
            --output /dev/null
          echo "Supabase REST request succeeded."
