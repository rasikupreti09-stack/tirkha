name: Keep Supabase Active (Best Effort)

on:
  schedule:
    - cron: '0 0 * * 1,4' # Monday and Thursday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required repository secrets
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d '\r')
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r')

          # Using -I (HEAD request) avoids parsing response bodies completely, 
          # preventing curl exit code 23 stream write errors.
          curl -I -s --max-time 30 \
            "${CLEAN_URL%/}/rest/v1/" \
            -H "apikey: ${CLEAN_KEY}"
          
          echo "Supabase keep-alive ping sent successfully."
