name: Keep Supabase Active (Best Effort)

on:
  schedule:
    - cron: '0 0 * * 1,4' # Monday and Thursday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required repository secrets
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY in GitHub repository Actions secrets."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "NEXT_PUBLIC_SUPABASE_URL must be an HTTPS URL."; exit 1 ;;
          esac

      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d '\r')
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r')

          # Read one public catalog row so the check proves the REST API,
          # public key, table, and anonymous read policy are all reachable.
          # This is best-effort activity only; Supabase may still pause a free project.
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            --get "${CLEAN_URL%/}/rest/v1/service_categories" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            -H "apikey: ${CLEAN_KEY}" \
            -H "Authorization: Bearer ${CLEAN_KEY}"
          
          echo "Supabase REST reachability check passed; this does not guarantee that the project will never pause."
