<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17382f">
    <title>Tirkha | तिर्खा — Offline</title>
    <style>
      :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7faf8;color:#172a24}
      *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px}
      main{width:min(100%,480px);border:1px solid #d7e4dc;border-radius:24px;background:#fff;padding:32px;box-shadow:0 20px 60px #17382f12}
      .mark{display:grid;width:48px;height:48px;place-items:center;border-radius:16px;background:#126b56;color:#fff;font-size:24px;font-weight:800}
      h1{margin:22px 0 8px;font-size:26px;letter-spacing:-.03em}p{color:#5c7067;line-height:1.65}button{margin-top:12px;border:0;border-radius:12px;background:#126b56;padding:12px 18px;color:#fff;font:700 14px system-ui,sans-serif;cursor:pointer}
    </style>
  </head>
  <body><main><div class="mark" aria-hidden="true">त</div><h1>You’re offline</h1><p>Tirkha’s saved map data is available on this device. Reconnect to refresh services, bookings, and live updates.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
